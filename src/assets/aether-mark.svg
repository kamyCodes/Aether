<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Aether">
  <defs>
    <!-- prism edge: ice glass turning warm at the apex, as in the source mark -->
    <linearGradient id="ae-edge" x1="0.2" y1="1" x2="0.8" y2="0">
      <stop offset="0" stop-color="#D9E4EF"/>
      <stop offset="0.55" stop-color="#C7D3E2"/>
      <stop offset="1" stop-color="#C9A75B"/>
    </linearGradient>
    <linearGradient id="ae-beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8FA6B8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#D1E3ED"/>
    </linearGradient>
  </defs>

  <!-- beam of light entering the left face -->
  <path d="M36 320 L146 310" stroke="url(#ae-beam)" stroke-width="40" stroke-linecap="round" fill="none"/>

  <!-- prism: equilateral outline, apex lit gold -->
  <path d="M256 118 L418 396 L94 396 Z"
        fill="none" stroke="url(#ae-edge)" stroke-width="38" stroke-linejoin="round"/>

  <!-- faint internal refraction crossing the glass -->
  <path d="M150 308 L326 298" stroke="#8D46C0" stroke-opacity="0.32" stroke-width="34" stroke-linecap="round" fill="none"/>

  <!-- dispersed spectrum leaving the right face: gold, violet, periwinkle -->
  <g stroke-linecap="round" fill="none">
    <path d="M362 296 L498 252" stroke="#C9A75B" stroke-width="40"/>
    <path d="M362 300 L506 300" stroke="#8D46C0" stroke-width="40"/>
    <path d="M362 304 L490 350" stroke="#7C9CFF" stroke-width="40"/>
  </g>
</svg>
